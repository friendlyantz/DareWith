<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found · DareWith</title>
  <link rel="icon" href="/icons/icon-512.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f6f5f1; --card: #ffffff; --border: #e4e2dc; --text: #17181a; --muted: #5d5f63; --primary: #c2410c; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141518; --card: #1e1f23; --border: #2e3036; --text: #ecebe6; --muted: #a5a49f; }
    }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 1.25rem; background: var(--bg); color: var(--text); font: 16px/1.5 "Inter", ui-sans-serif, system-ui, sans-serif; }
    main { width: 100%; max-width: 26rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; }
    img { width: 4.5rem; height: 4.5rem; }
    .code { font-size: .875rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
    h1 { font: 700 2rem/1.15 "Space Grotesk", ui-sans-serif, system-ui, sans-serif; letter-spacing: -.02em; }
    p { color: var(--muted); }
    a { margin-top: .5rem; display: inline-flex; align-items: center; height: 3rem; padding: 0 1.5rem; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="DareWith">
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>This page doesn’t exist, or it isn’t yours to see. Check the link, or head back to DareWith.</p>
    <a href="/">Go to DareWith</a>
  </main>
</body>
</html>
